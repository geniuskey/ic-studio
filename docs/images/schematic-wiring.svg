<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="Building a CMOS inverter schematic: place devices, wire them, highlight the output net, annotate the operating point">
  <style>
    text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6e8f2; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, monospace; }
    .muted { fill: #8a90b0; font-size: 12px; }
    .pin { font-size: 14px; }
    .dev { fill: none; stroke: #e6e8f2; stroke-width: 2; }
    .wire { fill: none; stroke: #5cc0ff; stroke-width: 2; stroke-dasharray: 1; stroke-dashoffset: 0; }
    .node { fill: #5cc0ff; }
    .hl { fill: none; stroke: #f5b83d; stroke-width: 3; stroke-linecap: round; }
    .hlglow { fill: none; stroke: #f5b83d; stroke-width: 9; stroke-linecap: round; opacity: 0.6; }
    .op rect { fill: #13261f; stroke: #2e7d4f; }
    .op text { fill: #4cd08a; font-size: 12px; }
    .row { fill: #161a2c; stroke: #262c48; }
    .rowlit { fill: #1f2442; stroke: #9d90ff; opacity: 0; }
    .step { font-size: 14px; font-weight: 600; }
    .a { animation-duration: 12s; animation-iteration-count: infinite; animation-fill-mode: both; animation-timing-function: ease-out; }
    .pP { animation-name: inP; }
    .pN { animation-name: inN; }
    .pR { animation-name: inR; }
    .wA { animation-name: drawA; }
    .wB { animation-name: drawB; }
    .wC { animation-name: drawC; }
    .dots { animation-name: dots; }
    .hlnet { animation-name: hl; }
    .hlglow { animation-name: hlGlow; }
    .outlbl { fill: #f5b83d; animation-name: outLbl; }
    .op1 { animation-name: op1; } .op2 { animation-name: op2; } .op3 { animation-name: op3; }
    .op4 { animation-name: op4; } .op5 { animation-name: op5; }
    .r1 { animation-name: r1; } .r2 { animation-name: r2; } .r3 { animation-name: r3; } .r4 { animation-name: r4; }
    @keyframes inP { 0%, 3% { opacity: 0; transform: translateY(-30px); } 9%, 96% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes inN { 0%, 9% { opacity: 0; transform: translateY(-30px); } 15%, 96% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes inR { 0%, 15% { opacity: 0; } 21%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes drawA { 0%, 25% { stroke-dashoffset: 1; opacity: 1; } 31%, 96% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes drawB { 0%, 30% { stroke-dashoffset: 1; opacity: 1; } 37%, 96% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes drawC { 0%, 36% { stroke-dashoffset: 1; opacity: 1; } 43%, 96% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes dots { 0%, 43% { opacity: 0; } 47%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes hl { 0%, 52% { opacity: 0; } 57%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes hlGlow { 0%, 52% { opacity: 0; } 58% { opacity: 0.9; } 65% { opacity: 0.35; } 72% { opacity: 0.8; } 96% { opacity: 0.6; } 100% { opacity: 0; } }
    @keyframes outLbl { 0%, 52% { fill: #e6e8f2; } 57%, 96% { fill: #f5b83d; } 100% { fill: #e6e8f2; } }
    @keyframes op1 { 0%, 76% { opacity: 0; } 80%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes op2 { 0%, 78% { opacity: 0; } 82%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes op3 { 0%, 80% { opacity: 0; } 84%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes op4 { 0%, 82% { opacity: 0; } 86%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes op5 { 0%, 84% { opacity: 0; } 88%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes r1 { 0%, 23% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @keyframes r2 { 0%, 24% { opacity: 0; } 26%, 48% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes r3 { 0%, 49% { opacity: 0; } 51%, 73% { opacity: 1; } 75%, 100% { opacity: 0; } }
    @keyframes r4 { 0%, 74% { opacity: 0; } 76%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="grid" x="10" y="10" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.2" fill="#262c48"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <g id="pmos" class="dev">
      <path d="M-40 0 H-24 M-16 -16 V16 M-8 -20 V20 M-8 -14 H0 V-40 M-8 14 H0 V40"/>
      <circle cx="-20" cy="0" r="4"/>
    </g>
    <g id="nmos" class="dev">
      <path d="M-40 0 H-16 M-16 -16 V16 M-8 -20 V20 M-8 -14 H0 V-40 M-8 14 H0 V40"/>
      <path d="M-7 10.5 L-1 14 L-7 17.5 Z" fill="#e6e8f2" stroke="none"/>
    </g>
    <path id="pinR" d="M0 -7 H10 L16 0 L10 7 H0 Z" fill="#161a2c" stroke="#e6e8f2" stroke-width="1.5"/>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="439" rx="14" fill="#0f1220" stroke="#262c48"/>
  <rect x="90" y="30" width="440" height="390" fill="url(#grid)"/>

  <!-- 1 place: devices drop onto the grid -->
  <g class="a pP"><use href="#pmos" transform="translate(300 160)"/><text class="muted" x="312" y="150">PMOS</text></g>
  <g class="a pN"><use href="#nmos" transform="translate(300 320)"/><text class="muted" x="312" y="350">NMOS</text></g>
  <g class="a pR">
    <path class="dev" d="M284 80 H316"/>
    <text x="300" y="70" text-anchor="middle" font-size="13">VDD</text>
    <path class="dev" d="M284 400 H316 M290 406 H310 M296 412 H304"/>
    <use href="#pinR" transform="translate(124 240)"/>
    <text class="pin" x="116" y="245" text-anchor="end">in</text>
    <use href="#pinR" transform="translate(440 240)"/>
  </g>
  <text class="pin outlbl a" x="464" y="245">out</text>

  <!-- 2 wire: nets draw themselves -->
  <path class="wire a wA" pathLength="1" d="M300 80 V120"/>
  <path class="wire a wA" pathLength="1" d="M300 360 V400"/>
  <path class="wire a wB" pathLength="1" d="M140 240 H220"/>
  <path class="wire a wB" pathLength="1" d="M260 160 H220 V320 H260"/>
  <path class="wire a wC" pathLength="1" d="M300 200 V280"/>
  <path class="wire a wC" pathLength="1" d="M300 240 H440"/>
  <g class="a dots">
    <circle class="node" cx="220" cy="240" r="4"/>
    <circle class="node" cx="300" cy="240" r="4"/>
  </g>

  <!-- 3 highlight net: the output net glows -->
  <path class="hlglow a" d="M300 200 V280 M300 240 H440" filter="url(#blur)"/>
  <g class="a hlnet">
    <path class="hl" d="M300 200 V280 M300 240 H440"/>
    <circle cx="300" cy="240" r="4.5" fill="#f5b83d"/>
  </g>

  <!-- 4 operating point annotation -->
  <g class="op mono">
    <g class="a op1"><rect x="322" y="73" width="54" height="20" rx="4"/><text x="349" y="87" text-anchor="middle">1.80 V</text></g>
    <g class="a op2"><rect x="150" y="250" width="54" height="20" rx="4"/><text x="177" y="264" text-anchor="middle">0.90 V</text></g>
    <g class="a op3"><rect x="372" y="250" width="54" height="20" rx="4"/><text x="399" y="264" text-anchor="middle">0.90 V</text></g>
    <g class="a op4"><rect x="312" y="202" width="50" height="20" rx="4"/><text x="337" y="216" text-anchor="middle">42 uA</text></g>
    <g class="a op5"><rect x="218" y="392" width="54" height="20" rx="4"/><text x="245" y="406" text-anchor="middle">0.00 V</text></g>
  </g>

  <!-- step list -->
  <text class="muted" x="570" y="70">CMOS inverter</text>
  <g transform="translate(570 86)">
    <rect class="row" width="200" height="52" rx="8"/>
    <rect class="rowlit a r1" width="200" height="52" rx="8"/>
    <text class="step" x="16" y="22">1 Place</text>
    <text class="muted" x="16" y="40">drop devices on the grid</text>
  </g>
  <g transform="translate(570 150)">
    <rect class="row" width="200" height="52" rx="8"/>
    <rect class="rowlit a r2" width="200" height="52" rx="8"/>
    <text class="step" x="16" y="22">2 Wire</text>
    <text class="muted" x="16" y="40">connect pins, nodes snap</text>
  </g>
  <g transform="translate(570 214)">
    <rect class="row" width="200" height="52" rx="8"/>
    <rect class="rowlit a r3" width="200" height="52" rx="8"/>
    <text class="step" x="16" y="22">3 Highlight net</text>
    <text class="muted" x="16" y="40">click a wire: net "out"</text>
  </g>
  <g transform="translate(570 278)">
    <rect class="row" width="200" height="52" rx="8"/>
    <rect class="rowlit a r4" width="200" height="52" rx="8"/>
    <text class="step" x="16" y="22">4 Operating point</text>
    <text class="muted" x="16" y="40">Annotate OP after F5</text>
  </g>
</svg>
