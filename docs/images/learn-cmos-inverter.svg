<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="A CMOS inverter drawn as two complementary switches: a low input turns the PMOS on and pulls the output high, a high input turns the NMOS on and pulls it low; a dot moves along the simulated transfer curve">
  <style>
    text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8a90b0; font-size: 12px; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, monospace; }
    .hi { fill: #e6e8f2; }
    .title { fill: #e6e8f2; font-size: 14px; font-weight: 600; }
    .grid { stroke: #262c48; stroke-width: 1; fill: none; }
    .axis { stroke: #3a4066; stroke-width: 1.5; fill: none; }
    .wire { stroke: #c9cde6; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .a { animation-iteration-count: infinite; animation-fill-mode: both; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .s0, .s1 { animation-duration: 8s; }
    .s0 { animation-name: s0; } .s1 { animation-name: s1; }
    @keyframes s0 { 0%, 38% { opacity: 1; } 44%, 92% { opacity: 0; } 98%, 100% { opacity: 1; } }
    @keyframes s1 { 0%, 46% { opacity: 0; } 52%, 86% { opacity: 1; } 92%, 100% { opacity: 0; } }
    .vtc { fill: none; stroke: #9d90ff; stroke-width: 2.6; }
    .on { stroke: #46d08a; stroke-width: 3; fill: none; }
    .cur { stroke: #46d08a; stroke-width: 2; stroke-dasharray: 5 6; fill: none; animation: flow 0.8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -11; } }
    .big { font-size: 22px; font-weight: 700; }

  </style>
  <rect x="0.5" y="0.5" width="799" height="359" rx="14" fill="#0f1220" stroke="#262c48"/>
  <rect x="24" y="20" width="390" height="320" rx="10" fill="#161a2c"/>
  <text x="44" y="46" class="title">CMOS inverter: two complementary switches</text>
  <text x="250" y="66" text-anchor="middle" class="hi">VDD = 1.8 V</text>
  <path class="wire" d="M210 70 H290"/>
  <path class="wire" d="M170 110 H208"/><circle cx="212" cy="110" r="4" fill="none" stroke="#c9cde6" stroke-width="2"/><path class="wire" d="M216 92 V128 M224 90 V130"/><path class="wire" d="M224 96 H246 V70 M224 124 H246 V150"/>
  <path class="wire" d="M170 230 H216"/><path class="wire" d="M216 212 V248 M224 210 V250"/><path class="wire" d="M224 216 H246 V190 M224 244 H246 V270"/>
  <path class="wire" d="M170 110 V230 M110 170 H170"/>
  <circle cx="170" cy="170" r="3.5" fill="#c9cde6"/>
  <path class="wire" d="M246 150 V190 M246 170 H330"/>
  <circle cx="246" cy="170" r="3.5" fill="#c9cde6"/>
  <path class="wire" d="M210 270 H290 M224 278 H276 M238 286 H262"/>
  <text x="250" y="304" text-anchor="middle">GND</text>
  <text x="290" y="114" class="hi">PMOS</text>
  <text x="290" y="234" class="hi">NMOS</text>
  <text x="100" y="160" text-anchor="end" class="hi">in</text>
  <text x="336" y="160" class="hi">out</text>

  <g class="s0 a">
    <path class="on" d="M216 90 V130 M224 90 V130"/>
    <path class="cur" d="M254 70 V162 H330"/>
    <text x="100" y="196" text-anchor="end" class="big mono" style="fill:#5cc0ff">0</text>
    <text x="336" y="198" class="big mono" style="fill:#9d90ff">1</text>
    <text x="44" y="326">in = 0: PMOS on, NMOS off, out pulled up to VDD</text>
  </g>
  <g class="s1 a">
    <path class="on" d="M216 210 V250 M224 210 V250"/>
    <path class="cur" d="M330 178 H254 V270"/>
    <text x="100" y="196" text-anchor="end" class="big mono" style="fill:#5cc0ff">1</text>
    <text x="336" y="198" class="big mono" style="fill:#9d90ff">0</text>
    <text x="44" y="326">in = 1: NMOS on, PMOS off, out pulled down to GND</text>
  </g>

  <rect x="424" y="20" width="352" height="320" rx="10" fill="#161a2c"/>
  <text x="470" y="46" class="title">Voltage transfer curve (simulated)</text>
  <path class="grid" d="M470 180 H740 M605 60 V300" stroke-dasharray="3 5"/>
  <path d="M470 300 L740 60" stroke="#3a4066" stroke-dasharray="2 4"/>
  <path id="vtc" class="vtc" d="M470.0 60.0 L471.5 60.0 L473.0 60.0 L474.5 60.0 L476.0 60.0 L477.5 60.0 L479.0 60.0 L480.5 60.0 L482.0 60.0 L483.5 60.0 L485.0 60.0 L486.5 60.0 L488.0 60.0 L489.5 60.0 L491.0 60.0 L492.5 60.0 L494.0 60.0 L495.5 60.0 L497.0 60.0 L498.5 60.0 L500.0 60.0 L501.5 60.0 L503.0 60.0 L504.5 60.0 L506.0 60.0 L507.5 60.0 L509.0 60.0 L510.5 60.0 L512.0 60.0 L513.5 60.0 L515.0 60.0 L516.5 60.0 L518.0 60.0 L519.5 60.0 L521.0 60.0 L522.5 60.0 L524.0 60.0 L525.5 60.0 L527.0 60.0 L528.5 60.0 L530.0 60.0 L531.5 60.0 L533.0 60.0 L534.5 60.0 L536.0 60.0 L537.5 60.0 L539.0 60.0 L540.5 60.1 L542.0 60.2 L543.5 60.3 L545.0 60.4 L546.5 60.7 L548.0 60.9 L549.5 61.2 L551.0 61.5 L552.5 61.9 L554.0 62.4 L555.5 62.8 L557.0 63.4 L558.5 64.0 L560.0 64.7 L561.5 65.4 L563.0 66.2 L564.5 67.1 L566.0 68.0 L567.5 69.1 L569.0 70.2 L570.5 71.4 L572.0 72.8 L573.5 74.2 L575.0 75.8 L576.5 77.6 L578.0 79.5 L579.5 81.6 L581.0 83.9 L582.5 86.5 L584.0 89.4 L585.5 92.8 L587.0 96.7 L588.5 101.3 L590.0 107.2 L591.5 115.5 L593.0 146.2 L594.5 219.5 L596.0 258.6 L597.5 264.9 L599.0 269.1 L600.5 272.3 L602.0 274.9 L603.5 277.2 L605.0 279.1 L606.5 280.8 L608.0 282.4 L609.5 283.8 L611.0 285.0 L612.5 286.2 L614.0 287.3 L615.5 288.2 L617.0 289.1 L618.5 290.0 L620.0 290.8 L621.5 291.5 L623.0 292.2 L624.5 292.8 L626.0 293.4 L627.5 293.9 L629.0 294.4 L630.5 294.9 L632.0 295.3 L633.5 295.8 L635.0 296.2 L636.5 296.5 L638.0 296.9 L639.5 297.2 L641.0 297.5 L642.5 297.7 L644.0 298.0 L645.5 298.2 L647.0 298.4 L648.5 298.6 L650.0 298.8 L651.5 299.0 L653.0 299.1 L654.5 299.3 L656.0 299.4 L657.5 299.5 L659.0 299.6 L660.5 299.7 L662.0 299.8 L663.5 299.8 L665.0 299.9 L666.5 299.9 L668.0 300.0 L669.5 300.0 L671.0 300.0 L672.5 300.0 L674.0 300.0 L675.5 300.0 L677.0 300.0 L678.5 300.0 L680.0 300.0 L681.5 300.0 L683.0 300.0 L684.5 300.0 L686.0 300.0 L687.5 300.0 L689.0 300.0 L690.5 300.0 L692.0 300.0 L693.5 300.0 L695.0 300.0 L696.5 300.0 L698.0 300.0 L699.5 300.0 L701.0 300.0 L702.5 300.0 L704.0 300.0 L705.5 300.0 L707.0 300.0 L708.5 300.0 L710.0 300.0 L711.5 300.0 L713.0 300.0 L714.5 300.0 L716.0 300.0 L717.5 300.0 L719.0 300.0 L720.5 300.0 L722.0 300.0 L723.5 300.0 L725.0 300.0 L726.5 300.0 L728.0 300.0 L729.5 300.0 L731.0 300.0 L732.5 300.0 L734.0 300.0 L735.5 300.0 L737.0 300.0 L738.5 300.0 L740.0 300.0"/>
  <circle cx="593.0" cy="190.7" r="4" fill="#f5b83d"/>
  <text x="601.0" y="182.7" style="fill:#f5b83d">V<tspan dy="3" style="font-size:9px">M</tspan><tspan dy="-3"> ≈ 0.83 V</tspan></text>
  <circle r="6" fill="#e6e8f2" stroke="#9d90ff" stroke-width="2">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1">
      <mpath href="#vtc"/>
    </animateMotion>
  </circle>
  <path class="axis" d="M470 60 V300 H740"/>
  <g text-anchor="middle"><text x="470" y="318">0</text><text x="605" y="318">0.9</text><text x="740" y="318">1.8</text>
    <text x="605" y="334" class="hi">v(in) (V)</text></g>
  <g text-anchor="end"><text x="464" y="304">0</text><text x="464" y="184">0.9</text><text x="464" y="64">1.8</text></g>
  <text x="620" y="90" class="hi">v(out)</text>
</svg>
