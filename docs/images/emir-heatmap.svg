  <!-- power grid -->
  <g fill="#2f6fb0" fill-opacity=".75" stroke="#5cc0ff" stroke-width="1">
    <rect x="48" y="77" width="468" height="6"/>
    <rect x="48" y="151" width="468" height="6"/>
    <rect x="48" y="225" width="468" height="6"/>
    <rect x="48" y="299" width="468" height="6"/>
    <rect x="48" y="373" width="468" height="6"/>
  </g>
  <g fill="#7a4fc0" fill-opacity=".7" stroke="#b79cff" stroke-width="1">
