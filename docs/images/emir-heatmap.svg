<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="title desc">
  <title id="title">IR drop and electromigration</title>
  <desc id="desc">A VDD power grid of metal1 rails and metal2 straps fed from two pads. Cells draw current, and the IR drop grows with distance from the pads, from blue near the pads to red far from them. The strap next to a pad carries the most current and exceeds the electromigration current density limit.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#262c48"/>
    </pattern>
    <linearGradient id="scale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#ff5d6c"/>
      <stop offset="0.20" stop-color="#fb8557"/>
      <stop offset="0.45" stop-color="#f5b83d"/>
      <stop offset="0.70" stop-color="#afbc95"/>
      <stop offset="1.00" stop-color="#5cc0ff"/>
    </linearGradient>
    <g id="load">
      <rect x="-9" y="-7" width="18" height="14" rx="2" fill="#0f1220" stroke="#e6e8f2" stroke-width="1"/>
      <path d="M0 -4 v7 M-3 0 l3 3.5 l3 -3.5" fill="none" stroke="#e6e8f2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <style>
    text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    :where(text:not([fill])) { fill: #e6e8f2; }
    .mono, .mono text { font-family: 'JetBrains Mono', Consolas, Menlo, monospace; }
    .muted { fill: #8a90b0; }
    .a { animation-duration: 10s; animation-iteration-count: infinite; animation-fill-mode: both; animation-timing-function: ease-in-out; }
    .b0 { animation-name: b0; }
    @keyframes b0 { 0%, 14% { opacity: 0; } 19%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
    .b1 { animation-name: b1; }
    @keyframes b1 { 0%, 20% { opacity: 0; } 25%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
    .b2 { animation-name: b2; }
    @keyframes b2 { 0%, 26% { opacity: 0; } 31%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
    .b3 { animation-name: b3; }
    @keyframes b3 { 0%, 32% { opacity: 0; } 37%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
    .b4 { animation-name: b4; }
    @keyframes b4 { 0%, 38% { opacity: 0; } 43%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
    .b5 { animation-name: b5; }
    @keyframes b5 { 0%, 44% { opacity: 0; } 49%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
    .loads { animation-name: loads; }
    @keyframes loads { 0%, 2% { opacity: 0; } 8%, 100% { opacity: 1; } }
    .pulse { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    .worst { animation-name: worst; }
    @keyframes worst { 0%, 52% { opacity: 0; } 56%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
    .em { animation-name: em; }
    @keyframes em { 0%, 62% { opacity: 0; } 66%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
    .glow { animation: glow .9s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; }
    @keyframes s1 { 0%, 13% { fill: #9d90ff; } 15%, 100% { fill: #8a90b0; } }
    @keyframes s2 { 0%, 13% { fill: #8a90b0; } 15%, 62% { fill: #9d90ff; } 64%, 100% { fill: #8a90b0; } }
    @keyframes s3 { 0%, 62% { fill: #8a90b0; } 64%, 100% { fill: #9d90ff; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect x=".5" y=".5" width="799" height="419" rx="14" fill="#0f1220" stroke="#262c48"/>
  <text x="24" y="34" font-size="16" font-weight="600">IR drop and electromigration</text>
  <text x="540" y="34" font-size="12" text-anchor="end" class="muted">net vdd</text>

  <rect x="24" y="52" width="516" height="352" rx="8" fill="#161a2c" stroke="#262c48"/>
  <rect x="25" y="53" width="514" height="350" rx="7" fill="url(#dots)"/>

