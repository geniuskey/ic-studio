<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Built-in engine versus ngspice: the same transient from both simulators overlays, with a small error strip below">
  <style>
    text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8a90b0; font-size: 12px; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, monospace; }
    .hi { fill: #e6e8f2; }
    .grid { stroke: #262c48; stroke-width: 1; fill: none; }
    .axis { stroke: #3a4066; stroke-width: 1.5; fill: none; }
    .bi { fill: none; stroke: #5cc0ff; stroke-width: 2.4; stroke-linejoin: round; }
    .ng { fill: none; stroke: #f5b83d; stroke-width: 2; stroke-dasharray: 7 5; stroke-linejoin: round; }
    .draw { stroke-dasharray: 1; }
    .a { animation-duration: 10s; animation-iteration-count: infinite; animation-fill-mode: both; animation-timing-function: ease-in-out; }
    .bi.a { animation-name: drawBi; }
    .ng.a { animation-name: converge; }
    .err { fill: none; stroke: #4cd08a; stroke-width: 1.8; stroke-dasharray: 1; animation-name: drawErr; }
    .lbl { animation-name: lbl; }
    @keyframes drawBi { 0% { stroke-dashoffset: 1; opacity: 1; } 30%, 95% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes converge {
      0%, 28% { opacity: 0; transform: translateY(22px); }
      36% { opacity: 1; transform: translateY(22px); }
      56%, 95% { opacity: 1; transform: none; }
      100% { opacity: 0; transform: none; }
    }
    @keyframes drawErr { 0%, 57% { stroke-dashoffset: 1; opacity: 1; } 74%, 95% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes lbl { 0%, 74% { opacity: 0; } 79%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

