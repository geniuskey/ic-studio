<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="A two-input NAND gate stepping through its truth table: the conducting transistors and the current path are highlighted for each input combination">
  <style>
    text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8a90b0; font-size: 12px; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, monospace; }
    .hi { fill: #e6e8f2; }
    .title { fill: #e6e8f2; font-size: 14px; font-weight: 600; }
    .grid { stroke: #262c48; stroke-width: 1; fill: none; }
    .axis { stroke: #3a4066; stroke-width: 1.5; fill: none; }
    .wire { stroke: #c9cde6; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .a { animation-iteration-count: infinite; animation-fill-mode: both; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .ph { opacity: 0; animation-name: ph; animation-duration: 10s; }
    @keyframes ph { 0% { opacity: 0; } 2%, 23% { opacity: 1; } 25%, 100% { opacity: 0; } }
    .cur { stroke: #46d08a; stroke-width: 2; stroke-dasharray: 5 6; fill: none; animation: flow 0.8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -11; } }
    .big { font-size: 18px; font-weight: 700; }

  </style>
  <rect x="0.5" y="0.5" width="799" height="379" rx="14" fill="#0f1220" stroke="#262c48"/>
  <rect x="24" y="20" width="470" height="350" rx="10" fill="#161a2c"/>
  <text x="44" y="46" class="title">NAND2: PMOS in parallel, NMOS in series</text>
  <text x="246" y="64" text-anchor="middle" class="hi">VDD</text>
  <path class="wire" d="M150 74 H340"/>
  <path class="wire" d="M114 110 H142"/><circle cx="146" cy="110" r="4" fill="none" stroke="#c9cde6" stroke-width="2"/><path class="wire" d="M150 94 V126 M158 92 V128 M158 98 H176 V74 M158 122 H176 V146"/><text x="110" y="114" text-anchor="end" class="hi">A</text>
  <path class="wire" d="M254 110 H282"/><circle cx="286" cy="110" r="4" fill="none" stroke="#c9cde6" stroke-width="2"/><path class="wire" d="M290 94 V126 M298 92 V128 M298 98 H316 V74 M298 122 H316 V146"/><text x="250" y="114" text-anchor="end" class="hi">B</text>
  <path class="wire" d="M176 146 V170 H316 V146 M246 170 V202 M246 170 H380"/>
  <circle cx="246" cy="170" r="3.5" fill="#c9cde6"/><circle cx="176" cy="170" r="3.5" fill="#c9cde6"/>
  <text x="386" y="174" class="hi">Y</text>
  <path class="wire" d="M184 226 H220"/><path class="wire" d="M220 210 V242 M228 208 V244 M228 214 H246 V202 M228 238 H246 V250"/><text x="180" y="230" text-anchor="end" class="hi">A</text>
  <path class="wire" d="M184 286 H220"/><path class="wire" d="M220 270 V302 M228 268 V304 M228 274 H246 V262 M228 298 H246 V310"/><text x="180" y="290" text-anchor="end" class="hi">B</text>
  <path class="wire" d="M246 250 V262"/>
  <path class="wire" d="M246 310 V322 M226 322 H266 M234 328 H258 M242 334 H250"/>

  <rect x="504" y="20" width="272" height="350" rx="10" fill="#161a2c"/>
  <text x="524" y="46" class="title">Truth table</text>
  <text x="560" y="80" text-anchor="middle" class="hi">A</text><text x="630" y="80" text-anchor="middle" class="hi">B</text><text x="700" y="80" text-anchor="middle" class="hi">Y</text>
  <path d="M524 90 H756" stroke="#3a4066"/>
  <text x="560" y="120" class="mono hi" text-anchor="middle">0</text><text x="630" y="120" class="mono hi" text-anchor="middle">0</text><text x="700" y="120" class="mono hi" text-anchor="middle">1</text><text x="560" y="160" class="mono hi" text-anchor="middle">0</text><text x="630" y="160" class="mono hi" text-anchor="middle">1</text><text x="700" y="160" class="mono hi" text-anchor="middle">1</text><text x="560" y="200" class="mono hi" text-anchor="middle">1</text><text x="630" y="200" class="mono hi" text-anchor="middle">0</text><text x="700" y="200" class="mono hi" text-anchor="middle">1</text><text x="560" y="240" class="mono hi" text-anchor="middle">1</text><text x="630" y="240" class="mono hi" text-anchor="middle">1</text><text x="700" y="240" class="mono hi" text-anchor="middle">0</text>
  <text x="524" y="300">Y = NOT (A AND B)</text>
  <text x="524" y="320">Y is 0 only when both</text>
  <text x="524" y="338">inputs are 1</text>
  <g class="ph a" style="animation-delay:0.0s">
    <rect x="144" y="88" width="40" height="44" rx="6" fill="rgba(70,208,138,0.18)" stroke="#46d08a" stroke-width="2"/><rect x="284" y="88" width="40" height="44" rx="6" fill="rgba(70,208,138,0.18)" stroke="#46d08a" stroke-width="2"/>
    <path class="cur" d="M176 74 V170 M316 74 V170 M176 170 H380"/>
    <rect x="520" y="94" width="220" height="36" rx="6" fill="rgba(157,144,255,0.18)" stroke="#9d90ff"/>
    <text x="110" y="136" text-anchor="end" class="mono big" style="fill:#5cc0ff">0</text>
    <text x="250" y="136" text-anchor="end" class="mono big" style="fill:#5cc0ff">0</text>
    <text x="180" y="250" text-anchor="end" class="mono big" style="fill:#5cc0ff">0</text>
    <text x="180" y="310" text-anchor="end" class="mono big" style="fill:#5cc0ff">0</text>
    <text x="396" y="200" class="mono big" style="fill:#9d90ff">1</text>
    <text x="44" y="356">A=0, B=0: a PMOS conducts: Y pulled up to 1</text>
  </g>  <g class="ph a" style="animation-delay:2.5s">
    <rect x="144" y="88" width="40" height="44" rx="6" fill="rgba(70,208,138,0.18)" stroke="#46d08a" stroke-width="2"/><rect x="214" y="264" width="40" height="44" rx="6" fill="rgba(70,208,138,0.18)" stroke="#46d08a" stroke-width="2"/>
    <path class="cur" d="M176 74 V170 M176 170 H380"/>
    <rect x="520" y="134" width="220" height="36" rx="6" fill="rgba(157,144,255,0.18)" stroke="#9d90ff"/>
    <text x="110" y="136" text-anchor="end" class="mono big" style="fill:#5cc0ff">0</text>
    <text x="250" y="136" text-anchor="end" class="mono big" style="fill:#5cc0ff">1</text>
    <text x="180" y="250" text-anchor="end" class="mono big" style="fill:#5cc0ff">0</text>
    <text x="180" y="310" text-anchor="end" class="mono big" style="fill:#5cc0ff">1</text>
    <text x="396" y="200" class="mono big" style="fill:#9d90ff">1</text>
    <text x="44" y="356">A=0, B=1: a PMOS conducts: Y pulled up to 1</text>
  </g>  <g class="ph a" style="animation-delay:5.0s">
    <rect x="284" y="88" width="40" height="44" rx="6" fill="rgba(70,208,138,0.18)" stroke="#46d08a" stroke-width="2"/><rect x="214" y="204" width="40" height="44" rx="6" fill="rgba(70,208,138,0.18)" stroke="#46d08a" stroke-width="2"/>
    <path class="cur" d="M316 74 V170 M176 170 H380"/>
    <rect x="520" y="174" width="220" height="36" rx="6" fill="rgba(157,144,255,0.18)" stroke="#9d90ff"/>
    <text x="110" y="136" text-anchor="end" class="mono big" style="fill:#5cc0ff">1</text>
    <text x="250" y="136" text-anchor="end" class="mono big" style="fill:#5cc0ff">0</text>
    <text x="180" y="250" text-anchor="end" class="mono big" style="fill:#5cc0ff">1</text>
    <text x="180" y="310" text-anchor="end" class="mono big" style="fill:#5cc0ff">0</text>
    <text x="396" y="200" class="mono big" style="fill:#9d90ff">1</text>
    <text x="44" y="356">A=1, B=0: a PMOS conducts: Y pulled up to 1</text>
  </g>  <g class="ph a" style="animation-delay:7.5s">
    <rect x="214" y="204" width="40" height="44" rx="6" fill="rgba(70,208,138,0.18)" stroke="#46d08a" stroke-width="2"/><rect x="214" y="264" width="40" height="44" rx="6" fill="rgba(70,208,138,0.18)" stroke="#46d08a" stroke-width="2"/>
    <path class="cur" d="M380 170 H246 V310"/>
    <rect x="520" y="214" width="220" height="36" rx="6" fill="rgba(157,144,255,0.18)" stroke="#9d90ff"/>
    <text x="110" y="136" text-anchor="end" class="mono big" style="fill:#5cc0ff">1</text>
    <text x="250" y="136" text-anchor="end" class="mono big" style="fill:#5cc0ff">1</text>
    <text x="180" y="250" text-anchor="end" class="mono big" style="fill:#5cc0ff">1</text>
    <text x="180" y="310" text-anchor="end" class="mono big" style="fill:#5cc0ff">1</text>
    <text x="396" y="200" class="mono big" style="fill:#9d90ff">0</text>
    <text x="44" y="356">A=1, B=1: both NMOS conduct: Y pulled down to 0</text>
  </g>
</svg>
