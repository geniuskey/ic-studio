    <rect class="cover a" x="760" y="56" width="400" height="228" fill="#161a2c"/>
  </g>
  <path class="axis" d="M380 60 V280 H760"/>
  <g text-anchor="middle">
    <text x="380" y="298">0</text><text x="456" y="298">1</text><text x="532" y="298">2</text><text x="608" y="298">3</text><text x="684" y="298">4</text><text x="760" y="298">5</text>
    <text x="570" y="314" class="hi">time (µs)</text>
  </g>
  <g text-anchor="end"><text x="374" y="284">0</text><text x="374" y="64">1 V</text></g>
  <g class="mark a">
    <path d="M494.0 280 V140.9 H380" stroke="#f5b83d" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
