<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="title desc">
  <title id="title">ics command line</title>
  <desc id="desc">A terminal runs ics sim with JSON output, then ics drc, which reports no violations, then ics lvs, which reports that the layout matches the schematic.</desc>
  <style>
    text { font-family: 'JetBrains Mono', Consolas, Menlo, monospace; font-size: 13px; white-space: pre; }
    :where(text:not([fill])) { fill: #e6e8f2; }
    .ui { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; }
    .muted { fill: #8a90b0; }
    .ok { fill: #4cd08a; }
    .ps { fill: #9d90ff; }
    .a { animation-duration: 12s; animation-iteration-count: infinite; animation-fill-mode: both; animation-timing-function: linear; }
    .cur { animation: cur 1s steps(1, end) infinite; }
    @keyframes cur { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    .p0 { animation-name: p0; }
    @keyframes p0 { 0%, 1% { opacity: 0; } 1.5%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .t0 { opacity: 0; animation-name: t0; }
    @keyframes t0 {
      0%, 0.8% { opacity: 0; transform: translateX(0); }
      1% { opacity: 1; transform: translateX(0); }
      2% { opacity: 1; transform: translateX(0); animation-timing-function: steps(27, end); }
      13% { opacity: 1; transform: translateX(210.6px); }
      14%, 100% { opacity: 0; transform: translateX(210.6px); }
    }
    .o00 { animation-name: o00; }
    @keyframes o00 { 0%, 15% { opacity: 0; } 15.5%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .o01 { animation-name: o01; }
    @keyframes o01 { 0%, 15% { opacity: 0; } 15.5%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .p1 { animation-name: p1; }
    @keyframes p1 { 0%, 19% { opacity: 0; } 19.5%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .t1 { opacity: 0; animation-name: t1; }
    @keyframes t1 {
      0%, 18.8% { opacity: 0; transform: translateX(0); }
      19% { opacity: 1; transform: translateX(0); }
      20% { opacity: 1; transform: translateX(0); animation-timing-function: steps(20, end); }
      29% { opacity: 1; transform: translateX(156px); }
      30%, 100% { opacity: 0; transform: translateX(156px); }
    }
    .o10 { animation-name: o10; }
    @keyframes o10 { 0%, 31% { opacity: 0; } 31.5%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .p2 { animation-name: p2; }
    @keyframes p2 { 0%, 35% { opacity: 0; } 35.5%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .t2 { opacity: 0; animation-name: t2; }
    @keyframes t2 {
      0%, 34.8% { opacity: 0; transform: translateX(0); }
      35% { opacity: 1; transform: translateX(0); }
      36% { opacity: 1; transform: translateX(0); animation-timing-function: steps(20, end); }
      45% { opacity: 1; transform: translateX(156px); }
      46%, 100% { opacity: 0; transform: translateX(156px); }
    }
    .o20 { animation-name: o20; }
    @keyframes o20 { 0%, 47% { opacity: 0; } 47.5%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .o21 { animation-name: o21; }
    @keyframes o21 { 0%, 48.5% { opacity: 0; } 49%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .o22 { animation-name: o22; }
    @keyframes o22 { 0%, 50% { opacity: 0; } 50.5%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .o23 { animation-name: o23; }
    @keyframes o23 { 0%, 51.5% { opacity: 0; } 52%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .o24 { animation-name: o24; }
    @keyframes o24 { 0%, 53% { opacity: 0; } 53.5%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .pf { animation-name: pf; }
    @keyframes pf { 0%, 56% { opacity: 0; } 56.5%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect x=".5" y=".5" width="799" height="419" rx="14" fill="#0f1220" stroke="#262c48"/>
  <rect x="24" y="20" width="752" height="380" rx="10" fill="#161a2c" stroke="#262c48"/>
  <path d="M24 30 a10 10 0 0 1 10 -10 h732 a10 10 0 0 1 10 10 v20 h-752 z" fill="#262c48"/>
  <circle cx="42" cy="35" r="5" fill="#ff5d6c"/><circle cx="58" cy="35" r="5" fill="#f5b83d"/><circle cx="74" cy="35" r="5" fill="#4cd08a"/>
  <text x="400" y="39" text-anchor="middle" class="ui muted">PowerShell · ics</text>

  <g class="a p0">
    <text x="44" y="78" class="ps">PS&gt;</text>
    <text x="75.2" y="78" textLength="210.6" lengthAdjust="spacing">ics sim myproj nand2 --json</text>
  </g>
  <g class="a t0">
    <rect x="75.2" y="64" width="222.6" height="19" fill="#161a2c"/>
    <rect class="cur" x="75.2" y="65" width="8" height="16" fill="#e6e8f2"/>
  </g>
  <text class="a o00 muted" x="44" y="98">{"backend":"builtin","elapsed_ms":2.7,"warnings":[],"datasets":[{"analysis":"op",</text>
  <text class="a o01 muted" x="44" y="118">"title":"Operating Point","vectors":{"v(a)":[0.0],"v(out)":[1.8],...}},...]}</text>
  <g class="a p1">
    <text x="44" y="148" class="ps">PS&gt;</text>
    <text x="75.2" y="148" textLength="156" lengthAdjust="spacing">ics drc myproj nand2</text>
  </g>
  <g class="a t1">
    <rect x="75.2" y="134" width="168" height="19" fill="#161a2c"/>
    <rect class="cur" x="75.2" y="135" width="8" height="16" fill="#e6e8f2"/>
  </g>
  <text class="a o10 ok" x="44" y="168">0 violation(s); 21 rules on 46 shapes in 3 ms</text>
  <g class="a p2">
    <text x="44" y="198" class="ps">PS&gt;</text>
    <text x="75.2" y="198" textLength="156" lengthAdjust="spacing">ics lvs myproj nand2</text>
  </g>
  <g class="a t2">
    <rect x="75.2" y="184" width="168" height="19" fill="#161a2c"/>
    <rect class="cur" x="75.2" y="185" width="8" height="16" fill="#e6e8f2"/>
  </g>
  <text class="a o20 " x="44" y="218">4 schematic / 4 layout devices, 4 matched</text>
  <text class="a o21 muted" x="44" y="238">  device M1 = M1</text>
  <text class="a o22 muted" x="44" y="258">  device M2 = M2</text>
  <text class="a o23 muted" x="44" y="278">  ...</text>
  <text class="a o24 ok" x="44" y="298">LVS: layout matches schematic</text>
  <g class="a pf">
    <text x="44" y="328" class="ps">PS&gt;</text>
    <rect class="cur" x="75.2" y="315" width="8" height="16" fill="#e6e8f2"/>
  </g>
</svg>
