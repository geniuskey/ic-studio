<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="IC Studio design loop: schematic, simulate, generate layout, route, DRC and LVS, extract parasitics, simulate again">
  <style>
    text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .label { font-size: 13px; fill: #e6e8f2; text-anchor: middle; }
    .muted { font-size: 12px; fill: #8a90b0; text-anchor: middle; }
    .box { fill: #161a2c; stroke: #3a4066; stroke-width: 1.5; }
    .glow { fill: #9d90ff; opacity: 0; }
    .track { fill: none; stroke: #262c48; stroke-width: 2; }
    .chev { fill: none; stroke: #5a6190; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .feed { stroke: #9d90ff; stroke-width: 2; stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
    .orbit { transform-box: view-box; transform-origin: 525px 215px; animation: orbit 10s infinite both; }
    .glow, .box, .ico { animation-duration: 10s; animation-iteration-count: infinite; animation-fill-mode: both; }
    .glow { animation-name: glow; }
    .box { animation-name: lit; }
    .ico { animation-name: ico; }
    .s1 .glow, .s1 .box, .s1 .ico { animation-delay: -0.2s; }
    .s2 .glow, .s2 .box, .s2 .ico { animation-delay: 1.8s; }
    .s3 .glow, .s3 .box, .s3 .ico { animation-delay: 3.8s; }
    .s4 .glow, .s4 .box, .s4 .ico { animation-delay: 5.8s; }
    .s5 .glow, .s5 .box, .s5 .ico { animation-delay: 7.8s; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    @keyframes orbit {
      0%, 8% { transform: rotate(0deg); }
      20%, 28% { transform: rotate(72deg); }
      40%, 48% { transform: rotate(144deg); }
      60%, 68% { transform: rotate(216deg); }
      80%, 88% { transform: rotate(288deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes glow { 0% { opacity: 0; } 2%, 10% { opacity: 0.55; } 14%, 100% { opacity: 0; } }
    @keyframes lit {
      0% { stroke: #3a4066; fill: #161a2c; }
      2%, 10% { stroke: #9d90ff; fill: #1f2442; }
      14%, 100% { stroke: #3a4066; fill: #161a2c; }
    }
    @keyframes ico { 0% { opacity: 0.55; } 2%, 10% { opacity: 1; } 14%, 100% { opacity: 0.55; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="tokenGlow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
    <path id="chev" class="chev" d="M-4 -6 L3 0 L-4 6"/>
    <rect id="boxShape" x="-70" y="-32" width="140" height="64" rx="10"/>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="419" rx="14" fill="#0f1220" stroke="#262c48"/>

  <!-- loop track and direction marks -->
  <circle class="track" cx="525" cy="215" r="150"/>
  <use href="#chev" transform="translate(403.6 126.8) rotate(306)"/>
  <use href="#chev" transform="translate(571.4 72.4) rotate(18)"/>
  <use href="#chev" transform="translate(675 215) rotate(90)"/>
  <use href="#chev" transform="translate(571.4 357.6) rotate(162)"/>
  <use href="#chev" transform="translate(403.6 303.2) rotate(234)"/>

  <!-- travelling token (passes behind the stage boxes) -->
  <g class="orbit">
    <circle cx="375" cy="215" r="10" fill="#9d90ff" filter="url(#tokenGlow)"/>
    <circle cx="375" cy="215" r="5" fill="#e6e8f2"/>
  </g>

  <!-- center label -->
  <text class="label" x="525" y="210" style="font-size:16px;font-weight:600">One design database</text>
  <text class="muted" x="525" y="231">schematic · layout · results</text>

  <!-- entry: schematic -->
  <line class="feed" x1="226" y1="215" x2="298" y2="215"/>
  <path class="chev" d="M296 209 L303 215 L296 221" style="stroke:#9d90ff"/>
  <g transform="translate(155 215)">
    <use href="#boxShape" fill="#1f2442" stroke="#9d90ff" stroke-width="1.5"/>
    <g transform="translate(0 -10)" stroke="#e6e8f2" stroke-width="1.6" fill="none">
      <path d="M-18 0 H-8 M-8 -8 V8 M-3 -10 V10 M-3 -6 H6 V-11 M-3 6 H6 V11"/>
      <path d="M6 -11 H16 M6 11 H16" stroke="#5cc0ff"/>
    </g>
    <text class="label" y="20">Schematic</text>
  </g>
  <text class="muted" x="155" y="268">start here</text>

  <!-- 1 simulate -->
  <g class="s1" transform="translate(375 215)">
    <use class="glow" href="#boxShape" filter="url(#blur)"/>
    <use class="box" href="#boxShape"/>
    <g class="ico" transform="translate(0 -10)">
      <path d="M-18 6 C-12 6 -10 -7 -4 -7 S4 7 10 7 S16 -3 18 -3" fill="none" stroke="#5cc0ff" stroke-width="2"/>
    </g>
    <text class="label" y="20">Simulate</text>
  </g>

  <!-- 2 generate layout -->
  <g class="s2" transform="translate(479 72)">
    <use class="glow" href="#boxShape" filter="url(#blur)"/>
    <use class="box" href="#boxShape"/>
    <g class="ico" transform="translate(0 -10)">
      <rect x="-17" y="-6" width="34" height="12" fill="#2e7d4f" stroke="#4cd08a"/>
      <rect x="-3" y="-11" width="6" height="22" fill="#c2413b" stroke="#ff6b62"/>
      <rect x="-12" y="-2" width="4" height="4" fill="#e6e8f2"/>
      <rect x="8" y="-2" width="4" height="4" fill="#e6e8f2"/>
    </g>
    <text class="label" y="20">Generate layout</text>
  </g>

  <!-- 3 route -->
  <g class="s3" transform="translate(646 127)">
    <use class="glow" href="#boxShape" filter="url(#blur)"/>
    <use class="box" href="#boxShape"/>
    <g class="ico" transform="translate(0 -10)">
      <rect x="-18" y="-9" width="30" height="6" fill="#2f6fb0" fill-opacity="0.75" stroke="#5cc0ff"/>
      <rect x="-6" y="4" width="24" height="6" fill="#2f6fb0" fill-opacity="0.75" stroke="#5cc0ff"/>
      <rect x="6" y="-11" width="6" height="22" fill="#7a4fc0" fill-opacity="0.7" stroke="#b79cff"/>
      <rect x="7" y="-8" width="4" height="4" fill="#ffd166"/>
      <rect x="7" y="5" width="4" height="4" fill="#ffd166"/>
    </g>
    <text class="label" y="20">Route</text>
  </g>

  <!-- 4 DRC / LVS -->
  <g class="s4" transform="translate(646 303)">
    <use class="glow" href="#boxShape" filter="url(#blur)"/>
    <use class="box" href="#boxShape"/>
    <g class="ico" transform="translate(0 -10)">
      <path d="M-10 0 L-3 7 L11 -8" fill="none" stroke="#4cd08a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="label" y="20">DRC · LVS</text>
  </g>

  <!-- 5 extract parasitics -->
  <g class="s5" transform="translate(479 358)">
    <use class="glow" href="#boxShape" filter="url(#blur)"/>
    <use class="box" href="#boxShape"/>
    <g class="ico" transform="translate(0 -10)" fill="none" stroke-width="1.6" stroke-linejoin="round">
      <path d="M-19 0 H-14 L-12 -5 L-9 5 L-6 -5 L-3 5 L-1 0 H5" stroke="#f5b83d"/>
      <path d="M5 0 H9 M9 -7 V7 M13 -7 V7 M13 0 H19" stroke="#e6e8f2"/>
    </g>
    <text class="label" y="20">Extract parasitics</text>
  </g>
</svg>
