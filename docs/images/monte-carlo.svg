  <!-- caption -->
  <text x="400" y="376" text-anchor="middle" style="font-size:13px"><tspan class="hi">process variation + Pelgrom mismatch</tspan><tspan class="mono" dx="18">σ(ΔVt) = A</tspan><tspan class="mono" dy="4" font-size="12">Vt</tspan><tspan class="mono" dy="-4"> / √(WL)</tspan></text>
</svg>
