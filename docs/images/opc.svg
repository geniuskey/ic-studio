<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Model-based OPC</title>
  <desc id="desc">An L-shaped poly feature prints with line-end pullback and corner rounding. OPC moves edge fragments over five iterations, adding hammerheads, serifs and a mouse bite to the mask, until the printed contour matches the drawn target. The mask is written to its own layer, poly_opc.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#262c48"/>
    </pattern>
    <polygon id="target" points="90,60 130,60 130,200 200,200 200,240 90,240" fill="none" stroke="#8a90b0" stroke-width="1.2" stroke-dasharray="4 3"/>
  </defs>
  <style>
    text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    :where(text:not([fill])) { fill: #e6e8f2; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, monospace; }
    .muted { fill: #8a90b0; }
    .poly { fill: #c2413b; fill-opacity: .8; stroke: #ff6b62; stroke-width: 1.5; }
    .drawn { fill: #c2413b; fill-opacity: .35; stroke: #ff6b62; stroke-width: 1; }
    .mask { fill: #9d90ff; fill-opacity: .28; stroke: #9d90ff; stroke-width: 1.5; }
    .a { animation-duration: 12s; animation-iteration-count: infinite; animation-fill-mode: both; animation-timing-function: ease-in-out; }

    .print { stroke-dasharray: 700; animation-name: print; animation-timing-function: linear; }
    @keyframes print { 0%, 4% { stroke-dashoffset: 700; } 16%, 100% { stroke-dashoffset: 0; } }
    .hl { animation-name: hl; }
    @keyframes hl { 0%, 16% { opacity: 0; } 20%, 100% { opacity: 1; } }
    .out { animation-name: out; }
    @keyframes out { 0%, 76% { opacity: 0; transform: translateY(6px); } 80%, 100% { opacity: 1; transform: translateY(0); } }
    @keyframes w0 { 0%, 27% { opacity: 1; } 28%, 100% { opacity: 0; } }
    .w0 { animation-name: w0; opacity: 0; }
    @keyframes w1 { 0%, 28% { opacity: 0; } 29%, 37% { opacity: 1; } 38%, 100% { opacity: 0; } }
    .w1 { animation-name: w1; opacity: 0; }
    @keyframes w2 { 0%, 38% { opacity: 0; } 39%, 47% { opacity: 1; } 48%, 100% { opacity: 0; } }
    .w2 { animation-name: w2; opacity: 0; }
    @keyframes w3 { 0%, 48% { opacity: 0; } 49%, 57% { opacity: 1; } 58%, 100% { opacity: 0; } }
    .w3 { animation-name: w3; opacity: 0; }
    @keyframes w4 { 0%, 58% { opacity: 0; } 59%, 67% { opacity: 1; } 68%, 100% { opacity: 0; } }
    .w4 { animation-name: w4; opacity: 0; }
    @keyframes w5 { 0%, 68% { opacity: 0; } 69%, 100% { opacity: 1; } }
    .w5 { animation-name: w5; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect x=".5" y=".5" width="799" height="399" rx="14" fill="#0f1220" stroke="#262c48"/>
  <text x="24" y="34" font-size="16" font-weight="600">Model-based OPC</text>
  <text x="776" y="34" font-size="12" text-anchor="end" class="muted">blur + resist threshold · fragments move against EPE</text>

  <!-- 1 drawn target -->
  <g transform="translate(24 52)">
    <rect width="240" height="290" rx="8" fill="#161a2c" stroke="#262c48"/>
    <rect x="1" y="1" width="238" height="288" rx="7" fill="url(#dots)"/>
    <text x="16" y="26" font-size="13" font-weight="600">1 Drawn target</text>
    <polygon points="90,60 130,60 130,200 200,200 200,240 90,240" class="poly"/>
    <text x="16" y="270" font-size="12" class="mono muted">poly</text>
  </g>

  <!-- 2 printed without OPC -->
  <g transform="translate(280 52)">
    <rect width="240" height="290" rx="8" fill="#161a2c" stroke="#262c48"/>
    <rect x="1" y="1" width="238" height="288" rx="7" fill="url(#dots)"/>
    <text x="16" y="26" font-size="13" font-weight="600">2 Printed (no OPC)</text>
    <polygon points="90,60 130,60 130,200 200,200 200,240 90,240" class="drawn"/>
    <use href="#target"/>
    <path class="a print" d="M 93 86 Q 93 72 107 72 H 113 Q 127 72 127 86 V 194 Q 127 203 136 203 H 174 Q 188 203 188 217 V 223 Q 188 237 174 237 H 104 Q 93 237 93 226 Z" fill="none" stroke="#ff5d6c" stroke-width="2"/>
    <g class="a hl" fill="none" stroke="#f5b83d" stroke-width="1.5">
      <circle cx="110" cy="66" r="13"/>
      <circle cx="94" cy="236" r="12"/>
      <circle cx="194" cy="220" r="13"/>
    </g>
    <g class="a hl" font-size="12" fill="#f5b83d">
      <text x="128" y="50" fill="#f5b83d">line-end pullback</text>
      <text x="40" y="270" fill="#f5b83d">corner rounding</text>
      <text x="150" y="182" fill="#f5b83d">pullback</text>
    </g>
  </g>

  <!-- 3 with OPC -->
  <g transform="translate(536 52)">
    <rect width="240" height="290" rx="8" fill="#161a2c" stroke="#262c48"/>
    <rect x="1" y="1" width="238" height="288" rx="7" fill="url(#dots)"/>
    <text x="16" y="26" font-size="13" font-weight="600">3 With OPC</text>
    <use href="#target"/>
      <g class="a w0">
        <polygon points="90,60 130,60 130,60 130,60 130,200 130,200 130,200 130,200 130,200 200,200 200,200 200,200 200,240 200,240 200,240 90,240 90,240 90,240 90,240 90,240 90,60 90,60" class="drawn"/>
        <path d="M 93 86 Q 93 72 107 72 H 113 Q 127 72 127 86 V 194 Q 127 203 136 203 H 174 Q 188 203 188 217 V 223 Q 188 237 174 237 H 104 Q 93 237 93 226 Z" fill="none" stroke="#ff5d6c" stroke-width="2"/>
        <text x="16" y="270" font-size="12" class="mono">drawn = mask</text>
        <text x="224" y="270" font-size="12" text-anchor="end" class="mono" fill="#ff5d6c">EPE 24.0 nm</text>
      </g>
      <g class="a w1">
        <polygon points="86.6,56.6 133.4,56.6 133.4,65.6 131.1,65.6 131.1,194.4 127.8,194.4 127.8,201.1 135.6,201.1 135.6,197.8 197.8,197.8 197.8,194.4 206.7,194.4 206.7,243.4 197.8,243.4 197.8,242.2 91.1,242.2 91.1,245.6 84.4,245.6 84.4,237.8 87.8,237.8 87.8,65.6 86.6,65.6" class="mask"/>
        <path d="M 91.3 72.6 Q 91.3 65.3 98.6 65.3 H 121.4 Q 128.7 65.3 128.7 72.6 V 196.2 Q 128.7 201.3 133.8 201.3 H 187.4 Q 194.7 201.3 194.7 208.6 V 231.4 Q 194.7 238.7 187.4 238.7 H 97.3 Q 91.3 238.7 91.3 232.7 Z" fill="none" stroke="#f5b83d" stroke-width="2"/>
        <text x="16" y="270" font-size="12" class="mono">iteration 1</text>
        <text x="224" y="270" font-size="12" text-anchor="end" class="mono" fill="#f5b83d">EPE 10.6 nm</text>
      </g>
      <g class="a w2">
        <polygon points="85.1,55.1 134.9,55.1 134.9,68.1 131.6,68.1 131.6,191.9 126.8,191.9 126.8,201.6 138.1,201.6 138.1,196.8 196.8,196.8 196.8,191.9 209.7,191.9 209.7,244.9 196.8,244.9 196.8,243.2 91.6,243.2 91.6,248.1 81.9,248.1 81.9,236.8 86.8,236.8 86.8,68.1 85.1,68.1" class="mask"/>
        <path d="M 90.6 66.5 Q 90.6 62.3 94.8 62.3 H 125.2 Q 129.4 62.3 129.4 66.5 V 197.2 Q 129.4 200.6 132.8 200.6 H 193.5 Q 197.7 200.6 197.7 204.8 V 235.2 Q 197.7 239.4 193.5 239.4 H 94.3 Q 90.6 239.4 90.6 235.7 Z" fill="none" stroke="#f5b83d" stroke-width="2"/>
        <text x="16" y="270" font-size="12" class="mono">iteration 2</text>
        <text x="224" y="270" font-size="12" text-anchor="end" class="mono" fill="#f5b83d">EPE 4.7 nm</text>
      </g>
      <g class="a w3">
        <polygon points="84.4,54.4 135.6,54.4 135.6,69.3 131.9,69.3 131.9,190.7 126.3,190.7 126.3,201.9 139.3,201.9 139.3,196.3 196.3,196.3 196.3,190.7 211.1,190.7 211.1,245.6 196.3,245.6 196.3,243.7 91.9,243.7 91.9,249.3 80.7,249.3 80.7,236.3 86.3,236.3 86.3,69.3 84.4,69.3" class="mask"/>
        <path d="M 90.2 63.8 Q 90.2 60.9 93.1 60.9 H 126.9 Q 129.8 60.9 129.8 63.8 V 197.7 Q 129.8 200.2 132.3 200.2 H 196.2 Q 199.1 200.2 199.1 203.1 V 236.9 Q 199.1 239.8 196.2 239.8 H 92.9 Q 90.2 239.8 90.2 237.1 Z" fill="none" stroke="#f5b83d" stroke-width="2"/>
        <text x="16" y="270" font-size="12" class="mono">iteration 3</text>
        <text x="224" y="270" font-size="12" text-anchor="end" class="mono" fill="#f5b83d">EPE 2.0 nm</text>
      </g>
      <g class="a w4">
        <polygon points="84.1,54.1 135.9,54.1 135.9,69.8 132,69.8 132,190.2 126.1,190.2 126.1,202 139.8,202 139.8,196.1 196.1,196.1 196.1,190.2 211.7,190.2 211.7,245.9 196.1,245.9 196.1,243.9 92,243.9 92,249.8 80.2,249.8 80.2,236.1 86.1,236.1 86.1,69.8 84.1,69.8" class="mask"/>
        <path d="M 90.1 62.6 Q 90.1 60.3 92.3 60.3 H 127.7 Q 129.9 60.3 129.9 62.6 V 197.9 Q 129.9 200.1 132.1 200.1 H 197.4 Q 199.7 200.1 199.7 202.3 V 237.7 Q 199.7 239.9 197.4 239.9 H 92.3 Q 90.1 239.9 90.1 237.7 Z" fill="none" stroke="#f5b83d" stroke-width="2"/>
        <text x="16" y="270" font-size="12" class="mono">iteration 4</text>
        <text x="224" y="270" font-size="12" text-anchor="end" class="mono" fill="#f5b83d">EPE 1.1 nm</text>
      </g>
      <g class="a w5">
        <polygon points="84,54 136,54 136,70 132,70 132,190 126,190 126,202 140,202 140,196 196,196 196,190 212,190 212,246 196,246 196,244 92,244 92,250 80,250 80,236 86,236 86,70 84,70" class="mask"/>
        <path d="M 90 62 Q 90 60 92 60 H 128 Q 130 60 130 62 V 198 Q 130 200 132 200 H 198 Q 200 200 200 202 V 238 Q 200 240 198 240 H 92 Q 90 240 90 238 Z" fill="none" stroke="#4cd08a" stroke-width="2"/>
        <text x="16" y="270" font-size="12" class="mono">iteration 5</text>
        <text x="224" y="270" font-size="12" text-anchor="end" class="mono" fill="#4cd08a">EPE 0.8 nm</text>
      </g>
  </g>

  <g font-size="12">
    <rect x="280" y="352" width="12" height="12" fill="none" stroke="#8a90b0" stroke-dasharray="3 2"/>
    <text x="298" y="362" class="muted">target</text>
    <rect x="350" y="352" width="12" height="12" fill="#9d90ff" fill-opacity=".28" stroke="#9d90ff"/>
    <text x="368" y="362" class="muted">mask</text>
    <line x1="414" y1="358" x2="432" y2="358" stroke="#ff5d6c" stroke-width="2"/>
    <text x="438" y="362" class="muted">printed, no OPC</text>
    <line x1="546" y1="358" x2="564" y2="358" stroke="#4cd08a" stroke-width="2"/>
    <text x="570" y="362" class="muted">printed, with OPC</text>
  </g>
  <g class="a out">
    <text x="656" y="388" font-size="13" text-anchor="middle" class="mono" fill="#9d90ff">mask → poly_opc</text>
  </g>
  <text x="24" y="388" font-size="12" class="muted">The drawn layer is never changed.</text>
</svg>
