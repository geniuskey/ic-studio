<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Cross-section of a CMOS inverter built up layer by layer: substrate, n-well, active, poly gates, n+ and p+ implants, contacts, metal1, via1 and metal2">
  <style>
    text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8a90b0; font-size: 12px; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, monospace; }
    .hi { fill: #e6e8f2; }
    .title { fill: #e6e8f2; font-size: 14px; font-weight: 600; }
    .grid { stroke: #262c48; stroke-width: 1; fill: none; }
    .axis { stroke: #3a4066; stroke-width: 1.5; fill: none; }
    .wire { stroke: #c9cde6; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .a { animation-iteration-count: infinite; animation-fill-mode: both; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    @keyframes L0 { 0%, 4.0% { opacity: 0; } 7.0%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes H0 { 0%, 4.0% { opacity: 0; } 6.0%, 12.5% { opacity: 1; } 14.0%, 100% { opacity: 0; } }
    @keyframes L1 { 0%, 12.5% { opacity: 0; } 15.5%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes H1 { 0%, 12.5% { opacity: 0; } 14.5%, 21.0% { opacity: 1; } 22.5%, 100% { opacity: 0; } }
    @keyframes L2 { 0%, 21.0% { opacity: 0; } 24.0%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes H2 { 0%, 21.0% { opacity: 0; } 23.0%, 29.5% { opacity: 1; } 31.0%, 100% { opacity: 0; } }
    @keyframes L3 { 0%, 29.5% { opacity: 0; } 32.5%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes H3 { 0%, 29.5% { opacity: 0; } 31.5%, 38.0% { opacity: 1; } 39.5%, 100% { opacity: 0; } }
    @keyframes L4 { 0%, 38.0% { opacity: 0; } 41.0%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes H4 { 0%, 38.0% { opacity: 0; } 40.0%, 46.5% { opacity: 1; } 48.0%, 100% { opacity: 0; } }
    @keyframes L5 { 0%, 46.5% { opacity: 0; } 49.5%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes H5 { 0%, 46.5% { opacity: 0; } 48.5%, 55.0% { opacity: 1; } 56.5%, 100% { opacity: 0; } }
    @keyframes L6 { 0%, 55.0% { opacity: 0; } 58.0%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes H6 { 0%, 55.0% { opacity: 0; } 57.0%, 63.5% { opacity: 1; } 65.0%, 100% { opacity: 0; } }
    @keyframes L7 { 0%, 63.5% { opacity: 0; } 66.5%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes H7 { 0%, 63.5% { opacity: 0; } 65.5%, 72.0% { opacity: 1; } 73.5%, 100% { opacity: 0; } }
    @keyframes L8 { 0%, 72.0% { opacity: 0; } 75.0%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes H8 { 0%, 72.0% { opacity: 0; } 74.0%, 80.5% { opacity: 1; } 82.0%, 100% { opacity: 0; } }

  </style>
  <rect x="0.5" y="0.5" width="799" height="399" rx="14" fill="#0f1220" stroke="#262c48"/>
  <rect x="24" y="20" width="532" height="364" rx="10" fill="#161a2c"/>
  <text x="44" y="46" class="title">Building an inverter, one mask layer at a time</text>
  <text x="160" y="104" text-anchor="middle">NMOS</text><text x="420" y="104" text-anchor="middle">PMOS</text>
  <g class="a" style="animation-name:L0;animation-duration:14.0s"><rect x="40" y="250" width="500" height="90" fill="#2a2f4a" stroke="#5a6190"/></g><g class="a" style="animation-name:L1;animation-duration:14.0s"><path d="M300 250 V300 Q300 316 316 316 H524 Q540 316 540 300 V250 Z" fill="rgba(120,200,120,0.25)" stroke="#78c878" stroke-dasharray="4 3"/></g><g class="a" style="animation-name:L2;animation-duration:14.0s"><rect x="60" y="244" width="200" height="12" fill="rgba(70,190,90,0.55)" stroke="#46be5a"/><rect x="320" y="244" width="200" height="12" fill="rgba(70,190,90,0.55)" stroke="#46be5a"/></g><g class="a" style="animation-name:L3;animation-duration:14.0s"><rect x="140" y="226" width="40" height="18" fill="rgba(230,60,60,0.8)" stroke="#e63c3c"/><rect x="400" y="226" width="40" height="18" fill="rgba(230,60,60,0.8)" stroke="#e63c3c"/><rect x="138" y="243" width="44" height="3" fill="#9aa3d0"/><rect x="398" y="243" width="44" height="3" fill="#9aa3d0"/></g><g class="a" style="animation-name:L4;animation-duration:14.0s"><path d="M68 256 V268 Q68 276 76 276 H130 Q138 276 138 268 V256 Z M182 256 V268 Q182 276 190 276 H244 Q252 276 252 268 V256 Z" fill="rgba(230,120,60,0.7)" stroke="#e6783c"/><path d="M328 256 V268 Q328 276 336 276 H390 Q398 276 398 268 V256 Z M442 256 V268 Q442 276 450 276 H504 Q512 276 512 268 V256 Z" fill="rgba(200,160,60,0.7)" stroke="#c8a03c"/><text x="103" y="272" text-anchor="middle" class="hi" style="font-size:10px">n+</text><text x="217" y="272" text-anchor="middle" class="hi" style="font-size:10px">n+</text><text x="363" y="272" text-anchor="middle" class="hi" style="font-size:10px">p+</text><text x="477" y="272" text-anchor="middle" class="hi" style="font-size:10px">p+</text></g><g class="a" style="animation-name:L5;animation-duration:14.0s"><rect x="95" y="196" width="16" height="48" fill="#ebebeb"/><rect x="209" y="196" width="16" height="48" fill="#ebebeb"/><rect x="355" y="196" width="16" height="48" fill="#ebebeb"/><rect x="469" y="196" width="16" height="48" fill="#ebebeb"/></g><g class="a" style="animation-name:L6;animation-duration:14.0s"><rect x="80" y="180" width="46" height="16" fill="rgba(80,140,250,0.75)" stroke="#508cfa"/><rect x="340" y="180" width="46" height="16" fill="rgba(80,140,250,0.75)" stroke="#508cfa"/><rect x="196" y="180" width="304" height="16" fill="rgba(80,140,250,0.75)" stroke="#508cfa"/></g><g class="a" style="animation-name:L7;animation-duration:14.0s"><rect x="420" y="150" width="16" height="30" fill="#fad250"/></g><g class="a" style="animation-name:L8;animation-duration:14.0s"><rect x="300" y="134" width="220" height="16" fill="rgba(210,100,230,0.7)" stroke="#d264e6"/></g>
  <text class="a" x="290" y="370" text-anchor="middle" style="animation-name:H0;animation-duration:14.0s;fill:#e6e8f2">p-type silicon wafer</text><text class="a" x="290" y="370" text-anchor="middle" style="animation-name:H1;animation-duration:14.0s;fill:#e6e8f2">n-well: a home for the PMOS</text><text class="a" x="290" y="370" text-anchor="middle" style="animation-name:H2;animation-duration:14.0s;fill:#e6e8f2">active: where transistors can be</text><text class="a" x="290" y="370" text-anchor="middle" style="animation-name:H3;animation-duration:14.0s;fill:#e6e8f2">poly: the transistor gates</text><text class="a" x="290" y="370" text-anchor="middle" style="animation-name:H4;animation-duration:14.0s;fill:#e6e8f2">implants: n+ and p+ source and drain</text><text class="a" x="290" y="370" text-anchor="middle" style="animation-name:H5;animation-duration:14.0s;fill:#e6e8f2">contacts: holes down to silicon</text><text class="a" x="290" y="370" text-anchor="middle" style="animation-name:H6;animation-duration:14.0s;fill:#e6e8f2">metal1: the first wiring layer</text><text class="a" x="290" y="370" text-anchor="middle" style="animation-name:H7;animation-duration:14.0s;fill:#e6e8f2">via1: metal1 to metal2</text><text class="a" x="290" y="370" text-anchor="middle" style="animation-name:H8;animation-duration:14.0s;fill:#e6e8f2">metal2: wiring above metal1</text>
  <rect x="562" y="20" width="214" height="364" rx="10" fill="#161a2c"/>
  <text x="578" y="46" class="title">Layers (masks)</text>
  <rect class="a" x="572" y="53" width="196" height="26" rx="5" fill="rgba(157,144,255,0.18)" stroke="#9d90ff" style="animation-name:H0;animation-duration:14.0s"/><text x="582" y="70" class="mono hi">1. substrate</text><rect class="a" x="572" y="83" width="196" height="26" rx="5" fill="rgba(157,144,255,0.18)" stroke="#9d90ff" style="animation-name:H1;animation-duration:14.0s"/><text x="582" y="100" class="mono hi">2. nwell</text><rect class="a" x="572" y="113" width="196" height="26" rx="5" fill="rgba(157,144,255,0.18)" stroke="#9d90ff" style="animation-name:H2;animation-duration:14.0s"/><text x="582" y="130" class="mono hi">3. active</text><rect class="a" x="572" y="143" width="196" height="26" rx="5" fill="rgba(157,144,255,0.18)" stroke="#9d90ff" style="animation-name:H3;animation-duration:14.0s"/><text x="582" y="160" class="mono hi">4. poly</text><rect class="a" x="572" y="173" width="196" height="26" rx="5" fill="rgba(157,144,255,0.18)" stroke="#9d90ff" style="animation-name:H4;animation-duration:14.0s"/><text x="582" y="190" class="mono hi">5. nplus / pplus</text><rect class="a" x="572" y="203" width="196" height="26" rx="5" fill="rgba(157,144,255,0.18)" stroke="#9d90ff" style="animation-name:H5;animation-duration:14.0s"/><text x="582" y="220" class="mono hi">6. contact</text><rect class="a" x="572" y="233" width="196" height="26" rx="5" fill="rgba(157,144,255,0.18)" stroke="#9d90ff" style="animation-name:H6;animation-duration:14.0s"/><text x="582" y="250" class="mono hi">7. metal1</text><rect class="a" x="572" y="263" width="196" height="26" rx="5" fill="rgba(157,144,255,0.18)" stroke="#9d90ff" style="animation-name:H7;animation-duration:14.0s"/><text x="582" y="280" class="mono hi">8. via1</text><rect class="a" x="572" y="293" width="196" height="26" rx="5" fill="rgba(157,144,255,0.18)" stroke="#9d90ff" style="animation-name:H8;animation-duration:14.0s"/><text x="582" y="310" class="mono hi">9. metal2</text>
</svg>
