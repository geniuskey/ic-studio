# WAT (wafer acceptance test) specification of the generic 180 nm technology: spec limits for
# process control and the value of each parameter in the model corners. Used by
# `ics process-data` and Tools > Process Data.
name = "generic180 WAT"
# Wafers at the start of the data that set the control limits.
baseline_wafers = 12

[[param]]
name = "vtn"
unit = "V"
description = "NMOS threshold voltage, W/L = 10/0.18 µm"
target = 0.45
lsl = 0.38
usl = 0.52
corners = { ff = 0.40, tt = 0.45, ss = 0.50 }
measure = { analysis = "dc", expr = "cross(-i(vd), 5.6u)", netlist = """
* constant-current threshold (100 nA x W/L) at Vds = 0.1 V
VG g 0 DC 0
VD d 0 DC 0.1
M1 d g 0 0 nmos w=10u l=0.18u
.dc VG 0 1.8 0.005
""" }

[[param]]
name = "vtp"
unit = "V"
description = "PMOS threshold voltage, W/L = 10/0.18 µm"
target = -0.45
lsl = -0.52
usl = -0.38
corners = { ff = -0.40, tt = -0.45, ss = -0.50 }
measure = { analysis = "dc", expr = "cross(abs(i(vd)), 5.6u)", netlist = """
* constant-current threshold (100 nA x W/L) at Vds = -0.1 V
VG g 0 DC 0
VD d 0 DC -0.1
M1 d g 0 0 pmos w=10u l=0.18u
.dc VG -1.8 0 0.005
""" }

[[param]]
name = "idsat_n"
unit = "µA/µm"
description = "NMOS saturation current at Vgs = Vds = 1.8 V"
target = 600
lsl = 520
usl = 680
corners = { ff = 660, tt = 600, ss = 540 }
measure = { analysis = "op", expr = "-i(vd) * 1e5", netlist = """
* saturation current per µm of width (W = 10 µm)
VG g 0 DC 1.8
VD d 0 DC 1.8
M1 d g 0 0 nmos w=10u l=0.18u
.op
""" }

[[param]]
name = "idsat_p"
unit = "µA/µm"
description = "PMOS saturation current at Vgs = Vds = -1.8 V"
target = 260
lsl = 220
usl = 300
corners = { ff = 275, tt = 260, ss = 245 }
measure = { analysis = "op", expr = "abs(i(vd)) * 1e5", netlist = """
* saturation current per µm of width (W = 10 µm)
VG g 0 DC -1.8
VD d 0 DC -1.8
M1 d g 0 0 pmos w=10u l=0.18u
.op
""" }

[[param]]
name = "tox"
unit = "nm"
description = "Gate oxide thickness (C-V)"
target = 4.0
lsl = 3.8
usl = 4.2

[[param]]
name = "rs_poly"
unit = "Ω/sq"
description = "Poly sheet resistance (silicided)"
target = 7.5
lsl = 6.5
usl = 8.5

[[param]]
name = "rs_nplus"
unit = "Ω/sq"
description = "n+ diffusion sheet resistance (silicided)"
target = 6.0
lsl = 5.0
usl = 7.0

[[param]]
name = "rs_m1"
unit = "mΩ/sq"
description = "Metal 1 sheet resistance"
target = 70
lsl = 60
usl = 80

# Model extraction (`ics corners`, Process Data > Extract corners): the model parameters fitted
# so that the simulated test structures (the `measure` of each parameter) match the data's
# means (tt) and each corner. A corner sets primary parameters to mean + z sigma; the other
# measured parameters follow from their correlation with them.
[extraction]
knobs = [
  { target = "model:nmos.vto", min = "0.2", max = "0.8" },
  { target = "model:nmos.kp", min = "20u", max = "500u", log = true },
  { target = "model:pmos.vto", min = "-0.8", max = "-0.2" },
  { target = "model:pmos.kp", min = "5u", max = "300u", log = true },
]

[extraction.corners]
ff = { idsat_n = 3.0, idsat_p = 3.0 }
ss = { idsat_n = -3.0, idsat_p = -3.0 }
fs = { idsat_n = 3.0, idsat_p = -3.0 }
sf = { idsat_n = -3.0, idsat_p = 3.0 }
