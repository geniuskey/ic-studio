[package]
name = "ics-mcp"
version = "0.2.14"
edition = "2024"
license.workspace = true
description = "Model Context Protocol server for IC Studio projects"

[dependencies]
ics-core = { version = "0.2.14", path = "../ics-core" }
ics-sim = { version = "0.2.14", path = "../ics-sim" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[lib]
path = "src/lib.rs"

