[package]
name = "ics-studio"
version = "0.2.13"
edition = "2024"
license.workspace = true

[[bin]]
name = "ic-studio"
path = "src/main.rs"

[dependencies]
dirs = "6"
eframe = { version = "0.37.0", features = ["persistence"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_plot = "0.38.0"
ics-core = { version = "0.2.13", path = "../ics-core" }
ics-mcp = { version = "0.2.13", path = "../ics-mcp" }
ics-sim = { version = "0.2.13", path = "../ics-sim" }
ics-optics = { version = "0.2.13", path = "../ics-optics" }
rfd = "0.18.0"
# SHA-256 of downloaded updates (already used by rustls).
ring = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
resvg = { version = "0.45.1", default-features = false, features = ["text"] }
roxmltree = "0.20.0"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot", "eframe"] }
