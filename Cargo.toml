[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/ics-studio"]

[workspace.package]
license = "GPL-3.0-or-later"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Release downloads: smaller binaries at the cost of a slower build (`cargo build --profile dist`).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
