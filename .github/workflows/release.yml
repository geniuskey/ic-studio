name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            ext: .exe
          # Built on Rocky Linux 8 (glibc 2.28), so the binaries run on RHEL / Rocky / Alma 8
          # and every newer distribution.
          - os: ubuntu-22.04
            container: rockylinux:8
            platform: linux-x86_64
            ext: ""
          - os: macos-latest
            platform: macos-aarch64
            ext: ""
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      # Signing runs only when these secrets are set (see docs/install.md).
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - name: Install build tools (Rocky Linux 8)
        if: matrix.container == 'rockylinux:8'
        run: |
          dnf install -y git gcc gcc-c++ make perl pkgconf-pkg-config curl tar gzip binutils \
            libxkbcommon-devel wayland-devel libX11-devel libXcursor-devel libXrandr-devel libXi-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the app and Python package versions
        shell: bash
        run: |
          v=$(grep -m1 '^version' crates/ics-studio/Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != crates/ics-studio version v$v"; exit 1; }
          for f in python/Cargo.toml python/pyproject.toml; do
            p=$(grep -m1 '^version' "$f" | cut -d'"' -f2)
            [ "$p" = "$v" ] || { echo "$f version $p != $v"; exit 1; }
          done
      - name: Build
        shell: bash
        run: cargo build --profile dist -p ics-studio -p ics-cli
      - name: Check the glibc requirement (Linux)
        if: runner.os == 'Linux'
        run: |
          need=$(objdump -T target/dist/ic-studio target/dist/ics | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "needs $need"
          [ -n "$need" ] || { echo "no glibc symbols found"; exit 1; }
          [ "$(printf '%s\nGLIBC_2.28\n' "$need" | sort -V | tail -1)" = "GLIBC_2.28" ] || { echo "needs newer than glibc 2.28"; exit 1; }
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        run: |
          echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          for b in ic-studio ics; do
            codesign --force --timestamp --options runtime --sign "$APPLE_SIGN_IDENTITY" "target/dist/$b"
          done
          ditto -c -k target/dist/ic-studio target/dist/ics notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          rm -f cert.p12 notarize.zip
      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          foreach ($b in "ic-studio", "ics") {
            & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "target\dist\$b.exe"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Remove-Item cert.pfx
      - name: Package
        shell: bash
        run: |
          mkdir -p dist pkg
          for b in ic-studio ics; do
            cp "target/dist/$b${{ matrix.ext }}" pkg/
            cp "target/dist/$b${{ matrix.ext }}" "dist/$b-${{ matrix.platform }}${{ matrix.ext }}"
          done
          "target/dist/ics${{ matrix.ext }}" examples pkg/examples
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/ic-studio-${{ matrix.platform }}.zip" ./pkg/*
          else
            tar -czf "dist/ic-studio-${{ matrix.platform }}.tar.gz" -C pkg .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add the installers
        run: cp scripts/install.ps1 scripts/install.sh dist/
      # The installers and the in-app updater check every download against this list.
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
