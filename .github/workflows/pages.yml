name: User guide

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/guide-seo.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.52"
      - run: mdbook build docs
      - run: mdbook build docs/ko
      - run: python3 scripts/guide-seo.py target/guide
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/guide

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
