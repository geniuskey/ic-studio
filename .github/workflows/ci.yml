name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint the Python extension
        working-directory: python
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Build and test the Python API
        run: |
          python -m pip install ./python pytest numpy
          python -m pytest python/tests -q

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            mesa-vulkan-drivers ngspice
      - name: Build all crates
        run: cargo build --workspace --all-targets
      - name: Core, simulator and CLI tests
        run: cargo test -p ics-core -p ics-sim -p ics-optics -p ics-cli
      - name: Headless UI tests (software Vulkan)
        if: runner.os == 'Linux'
        run: cargo test -p ics-studio --test ui -- --test-threads=1
      - name: Release build of the desktop app
        run: cargo build --release -p ics-studio -p ics-cli
