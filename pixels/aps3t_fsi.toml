# The demo 3T pixel (work/aps3t, 10.2 µm, generic 180 nm process) as a front-side illuminated
# pixel: the metal lines over it and the photodiode come from its layout.
#   ics pixel pixels/aps3t_fsi.toml --project <demo project> --lux 100
name = "aps3t FSI"

[layout]
cell = "aps3t"
boundary = "boundary"           # the pixel frame; the pitch follows from it

[microlens]
height = 2.5
center = "photodiode"           # sit over the off-centre photodiode (try without it)

[[layers]]
name = "planarisation"
material = "resin"
thickness = 0.4

[[layers]]
name = "colour filter"
kind = "color_filter"
thickness = 0.9

[[layers]]
name = "passivation"
material = "si3n4"
thickness = 0.5

[[layers]]
name = "metal 3"
material = "sio2"
thickness = 0.6
pattern = { material = "al", layout = "metal3" }

[[layers]]
name = "IMD 2"
material = "sio2"
thickness = 0.8

[[layers]]
name = "metal 2"
material = "sio2"
thickness = 0.5
pattern = { material = "al", layout = "metal2" }

[[layers]]
name = "IMD 1"
material = "sio2"
thickness = 0.8

[[layers]]
name = "metal 1"
material = "sio2"
thickness = 0.5
pattern = { material = "al", layout = "metal1" }

[[layers]]
name = "PMD"
material = "sio2"
thickness = 0.8

[[arc]]
material = "si3n4"
thickness = 0.06

[photodiode]
top = 0.1
bottom = 3.0
layout = "active not interact poly"   # diffusion without a gate
