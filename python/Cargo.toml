[package]
name = "icstudio-py"
version = "0.2.5"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Python API for IC Studio projects"
publish = false

# Built by maturin (`pip install ./python`); kept out of the Cargo workspace so that building
# the workspace does not need a Python interpreter.
[workspace]

[lib]
name = "icstudio"
crate-type = ["cdylib", "rlib"]

[dependencies]
ics-core = { path = "../crates/ics-core" }
ics-sim = { path = "../crates/ics-sim" }
ics-mcp = { path = "../crates/ics-mcp" }
serde_json = "1.0.154"
pyo3 = { version = "0.25", features = ["abi3-py39"] }

[build-dependencies]
pyo3-build-config = "0.25"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
