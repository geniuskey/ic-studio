# SkyWater SKY130 (open_pdks "sky130A") for IC Studio.
#
# Layers, vias and devices are self-contained here; only the SPICE models come from an
# installed PDK, found through $PDK_ROOT (e.g. a volare or open_pdks install).
# Widths, spacings and enclosures follow the SKY130 periphery rules; vias use the larger
# (one-direction) enclosure on all sides, which is conservative.

name = "sky130A"
dbu_per_um = 1000
grid = 0.005

# Checks added to the deck derived from the layer rules: every poly contact needs npc around
# it (licon.8 / npc.5: 0.1 um enclosure).
drc_extra = [
  "pcon = licon1 and poly",
  "pcon_npc = npc size -0.1",
  "pcon_bad = pcon not inside pcon_npc",
  "NPC.EN: flag pcon_bad",
]

[[layer]]
name = "nwell"
gds = 64
datatype = 20
width = 0.84
space = 1.27
color = "#78c878"
fill = "dots"

[[layer]]
name = "diff"
gds = 65
datatype = 20
width = 0.15
space = 0.27
color = "#46be5a"
fill = "hatch"

[[layer]]
name = "tap"
gds = 65
datatype = 44
width = 0.15
space = 0.27
color = "#a0d264"
fill = "hatch"

[[layer]]
name = "nsdm"
gds = 93
datatype = 44
width = 0.38
space = 0.38
color = "#e6783c"
fill = "outline"

[[layer]]
name = "psdm"
gds = 94
datatype = 20
width = 0.38
space = 0.38
color = "#c8a03c"
fill = "outline"

[[layer]]
name = "npc"
gds = 95
datatype = 20
width = 0.27
space = 0.27
color = "#b4783c"
fill = "outline"

[[layer]]
name = "lvtn"
gds = 125
datatype = 44
width = 0.38
space = 0.38
color = "#a078c8"
fill = "outline"

[[layer]]
name = "hvtp"
gds = 78
datatype = 44
width = 0.38
space = 0.38
color = "#c878a0"
fill = "outline"

[[layer]]
name = "hvi"
gds = 75
datatype = 20
width = 0.6
space = 0.7
color = "#787878"
fill = "outline"

[[layer]]
name = "poly"
gds = 66
datatype = 20
width = 0.15
space = 0.21
routing = true
color = "#e63c3c"
fill = "backhatch"

[[layer]]
name = "licon1"
gds = 66
datatype = 44
color = "#ebebeb"
fill = "cross"

[[layer]]
name = "li1"
gds = 67
datatype = 20
width = 0.17
space = 0.17
routing = true
color = "#8cb4f0"
fill = "hatch"

[[layer]]
name = "mcon"
gds = 67
datatype = 44
color = "#f0d250"
fill = "cross"

[[layer]]
name = "met1"
gds = 68
datatype = 20
width = 0.14
space = 0.14
routing = true
color = "#508cfa"
fill = "hatch"

[[layer]]
name = "via"
gds = 68
datatype = 44
color = "#fad250"
fill = "cross"

[[layer]]
name = "met2"
gds = 69
datatype = 20
width = 0.14
space = 0.14
routing = true
color = "#d264e6"
fill = "backhatch"

[[layer]]
name = "via2"
gds = 69
datatype = 44
color = "#78e6e6"
fill = "cross"

[[layer]]
name = "met3"
gds = 70
datatype = 20
width = 0.3
space = 0.3
routing = true
color = "#f0aa50"
fill = "hatch"

[[layer]]
name = "via3"
gds = 70
datatype = 44
color = "#e6e678"
fill = "cross"

