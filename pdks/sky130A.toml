[roles]
diffusion = ["diff", "tap"]
tap = "tap"
poly = "poly"
nwell = "nwell"
nimplant = "nsdm"
pimplant = "psdm"
diff_contact = "licon"
poly_contact = "licon_poly"
label = "text"

[rules]
gate_contact_space = 0.08
poly_endcap = 0.13
implant_enc = 0.125
nwell_enc = 0.18
marker_enc = 0.18

# Nitride poly cut over every poly contact.
[[pcell_layer]]
layer = "npc"
around = "poly_contact"
enc = 0.1

[[via]]
name = "licon"
bottom = "diff"
cut = "licon1"
top = "li1"
size = 0.17
space = 0.17
enc_bottom = 0.06
enc_top = 0.08
resistance = 152

[[via]]
name = "licon_tap"
bottom = "tap"
cut = "licon1"
top = "li1"
size = 0.17
space = 0.17
enc_bottom = 0.06
enc_top = 0.08
resistance = 152

[[via]]
name = "licon_poly"
bottom = "poly"
cut = "licon1"
top = "li1"
size = 0.17
space = 0.17
enc_bottom = 0.08
enc_top = 0.08
resistance = 152

[[via]]
name = "mcon"
bottom = "li1"
cut = "mcon"
top = "met1"
size = 0.17
space = 0.19
enc_bottom = 0.0
enc_top = 0.06
resistance = 9.3

[[via]]
name = "via"
bottom = "met1"
cut = "via"
top = "met2"
size = 0.15
space = 0.17
enc_bottom = 0.085
enc_top = 0.085
resistance = 4.5

[[via]]
name = "via2"
bottom = "met2"
cut = "via2"
top = "met3"
size = 0.2
space = 0.2
enc_bottom = 0.085
enc_top = 0.065
resistance = 3.41

[[via]]
name = "via3"
bottom = "met3"
cut = "via3"
top = "met4"
size = 0.2
space = 0.2
enc_bottom = 0.09
enc_top = 0.065
resistance = 3.41

# First match wins; the first device of each polarity is the default for generic
# schematic models ("nmos" / "pmos").
[[device]]
name = "sky130_fd_pr__nfet_01v8"
type = "nmos"
exclude = ["lvtn", "hvi"]
subckt = true

[[device]]
name = "sky130_fd_pr__nfet_01v8_lvt"
type = "nmos"
layers = ["lvtn"]
exclude = ["hvi"]
subckt = true

[[device]]
name = "sky130_fd_pr__pfet_01v8"
type = "pmos"
exclude = ["lvtn", "hvtp", "hvi"]
subckt = true

[[device]]
name = "sky130_fd_pr__pfet_01v8_lvt"
type = "pmos"
layers = ["lvtn"]
exclude = ["hvi"]
subckt = true

[[device]]
name = "sky130_fd_pr__pfet_01v8_hvt"
type = "pmos"
layers = ["hvtp"]
exclude = ["hvi"]
subckt = true

[models]
path = "${PDK_ROOT}/sky130A/libs.tech/ngspice/sky130.lib.spice"
corners = ["tt", "ff", "ss", "sf", "fs"]
default = "tt"
length_unit = "um"

# Sign-off checks with the tools' own decks from the installed PDK.
[[signoff]]
name = "KLayout DRC (sky130A_mr)"
tool = "klayout"
check = "drc"
deck = "${PDK_ROOT}/sky130A/libs.tech/klayout/drc/sky130A_mr.drc"

[[signoff]]
name = "netgen LVS"
tool = "netgen"
check = "lvs"
deck = "${PDK_ROOT}/sky130A/libs.tech/netgen/sky130A_setup.tcl"
